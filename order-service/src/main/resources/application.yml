micronaut:
  application:
    name: order-service
  server:
    port: 8083

datasources:
  default:
    url: jdbc:h2:mem:orderdb;DB_CLOSE_DELAY=-1;CASE_INSENSITIVE_IDENTIFIERS=TRUE
    driverClassName: org.h2.Driver
    username: sa
    password: ""

jpa:
  default:
    properties:
      hibernate:
        hbm2ddl:
          auto: update
