name: CI

on:
  pull_request:
    branches:
      - main
      - dev
  push:
    branches:
      - main
      - dev

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Maven tests
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Make Maven wrapper executable
        run: chmod +x mvnw

      # Ajetaan testit ja kääntö (generoi YAML-tiedoston facade-moduuliin)
      - name: Run tests
        run: ./mvnw --batch-mode --no-transfer-progress test

      - name: Install Redoc CLI
        run: npm install -g @redocly/cli

      # Generoidaan HTML suoraan facaden target-kansiosta ilman etsintäsilmukoita
      - name: Generate HTML API Docs
        run: |
          mkdir -p api-docs
          redocly build-docs facade/target/classes/META-INF/swagger/*.yml -o api-docs/api-dokumentaatio.html

      - name: Upload API Docs Artifact
        uses: actions/upload-artifact@v4
        with:
          name: api-documentation
          path: api-docs/api-dokumentaatio.html
