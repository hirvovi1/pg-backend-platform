#Sat Sep 19 22:55:51 EEST 2026
micronaut.application.name=pg-api-facade
app.version=@project.version@
micronaut.server.port=8091
# Aktivoidaan Micronautin globaali CORS-moottori
micronaut.server.cors.enabled=true
# Määritellään sallittu frontend-osoite (Vite) listan ensimmäiseksi alkioksi
micronaut.server.cors.configurations.frontend.allowed-origins[0]=http://localhost:5173
# Sallitut HTTP-metodit esipyyntöjä varten
micronaut.server.cors.configurations.frontend.allowed-methods[0]=GET
micronaut.server.cors.configurations.frontend.allowed-methods[1]=POST
micronaut.server.cors.configurations.frontend.allowed-methods[2]=OPTIONS
micronaut.server.cors.configurations.frontend.allowed-methods[3]=PUT
micronaut.server.cors.configurations.frontend.allowed-methods[4]=DELETE
micronaut.server.cors.configurations.webstable.allowed-headers[0]=Content-Type
micronaut.server.cors.configurations.webstable.allowed-headers[1]=Accept
micronaut.server.cors.configurations.webstable.allowed-headers[2]=Authorization

